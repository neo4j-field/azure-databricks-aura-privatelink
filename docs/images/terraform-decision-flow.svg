<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img">
  <title>Which Terraform stack to apply</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6470"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C42B12"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6DB4"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1a1a1a" flood-opacity="0.10"/></filter></defs>
  <rect x="10" y="10" width="960" height="400" rx="16" fill="#FFFFFF" stroke="#E7E4DB" stroke-width="1" filter="url(#sh)"/>
  <rect x="808" y="34" width="10" height="10" rx="2" fill="#8A8A8A"/><text x="826" y="43" font-size="12" fill="#16233A">Azure / customer</text><rect x="702" y="34" width="10" height="10" rx="2" fill="#E1503A"/><text x="720" y="43" font-size="12" fill="#16233A">Databricks</text>
  <rect x="40" y="90" width="330" height="80" rx="10" fill="#F1F1EE" stroke="#DAD7CE" stroke-width="1.5"/>
  <text x="205.0" y="135.0" font-size="12" fill="#16233A" text-anchor="middle" font-weight="bold">Any Databricks Serverless consumers?</text>
  <path d="M373,130 H517" fill="none" stroke="#C42B12" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="445" y="122" font-size="11" fill="#16233A" text-anchor="middle" font-weight="bold">Yes</text>
  <text x="205.0" y="190" font-size="10" fill="#5C6470" text-anchor="middle">No: you do not need the NCC stack</text>
  <rect x="520" y="90" width="400" height="80" rx="10" fill="#FDF2EF" stroke="#E1503A" stroke-width="1.5"/>
  <text x="720.0" y="127.5" font-size="13" fill="#C42B12" text-anchor="middle" font-weight="bold">NCC stack</text>
  <text x="720.0" y="147.5" font-size="10" fill="#A8776C" text-anchor="middle" font-family="Menlo, monospace">databricks-ncc/</text>
  <rect x="40" y="210" width="330" height="80" rx="10" fill="#F1F1EE" stroke="#DAD7CE" stroke-width="1.5"/>
  <text x="205.0" y="247.5" font-size="12" fill="#16233A" text-anchor="middle" font-weight="bold">Any workloads in your own VNet?</text>
  <text x="205.0" y="267.5" font-size="10" fill="#5C6470" text-anchor="middle">AKS, ADF, classic Databricks, VMs</text>
  <path d="M373,250 H517" fill="none" stroke="#8A8A8A" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <text x="445" y="242" font-size="11" fill="#16233A" text-anchor="middle" font-weight="bold">Yes</text>
  <text x="205.0" y="308" font-size="10" fill="#5C6470" text-anchor="middle">No: you do not need the Private Endpoint stack</text>
  <rect x="520" y="210" width="400" height="80" rx="10" fill="#F1F1EE" stroke="#DAD7CE" stroke-width="1.5"/>
  <text x="720.0" y="247.5" font-size="13" fill="#16233A" text-anchor="middle" font-weight="bold">Private Endpoint stack</text>
  <text x="720.0" y="267.5" font-size="10" fill="#5C6470" text-anchor="middle" font-family="Menlo, monospace">azure-private-endpoint/</text>
  <rect x="40" y="326" width="880" height="56" rx="10" fill="#F1F1EE" stroke="#DAD7CE" stroke-width="1.5"/>
  <text x="480.0" y="351.0" font-size="13" fill="#16233A" text-anchor="middle" font-weight="bold">Yes to both? Apply both stacks.</text>
  <text x="480.0" y="369.0" font-size="10" fill="#5C6470" text-anchor="middle">They are independent root modules, so run them side by side</text>
</svg>
