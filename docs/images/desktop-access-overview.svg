<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img">
  <title>Two ways to reach Aura privately from a developer laptop</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6470"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C42B12"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6DB4"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1a1a1a" flood-opacity="0.10"/></filter></defs>
  <rect x="10" y="10" width="1080" height="540" rx="16" fill="#FFFFFF" stroke="#E7E4DB" stroke-width="1" filter="url(#sh)"/>
  <rect x="1000" y="34" width="10" height="10" rx="2" fill="#2E6DB4"/><text x="1018" y="43" font-size="12" fill="#16233A">Neo4j</text><rect x="854" y="34" width="10" height="10" rx="2" fill="#8A8A8A"/><text x="872" y="43" font-size="12" fill="#16233A">Azure / customer</text>
  <rect x="100" y="64" width="900" height="60" rx="10" fill="#F1F1EE" stroke="#DAD7CE" stroke-width="1.5"/>
  <text x="550.0" y="91.5" font-size="13" fill="#16233A" text-anchor="middle" font-weight="bold">Your laptop</text>
  <text x="550.0" y="111.5" font-size="10" fill="#5C6470" text-anchor="middle">public DNS gives 52.x.x.x for &lt;aura-instance-id&gt;.databases.neo4j.io, so Aura refuses the connection</text>
  <rect x="100" y="190" width="380" height="212" rx="14" fill="none" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="114" y="184" font-size="10" fill="#5C6470" font-weight="bold" letter-spacing="0.6">OPTION A: AZURE BASTION</text>
  <rect x="620" y="190" width="380" height="212" rx="14" fill="none" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="634" y="184" font-size="10" fill="#5C6470" font-weight="bold" letter-spacing="0.6">OPTION B: P2S VPN GATEWAY</text>
  <path d="M290,127 V211" fill="none" stroke="#8A8A8A" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <path d="M810,127 V211" fill="none" stroke="#8A8A8A" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <rect x="120" y="212" width="340" height="70" rx="10" fill="#F1F1EE" stroke="#DAD7CE" stroke-width="1.5"/>
  <text x="290.0" y="237.0" font-size="13" fill="#16233A" text-anchor="middle" font-weight="bold">Azure Bastion</text>
  <text x="290.0" y="257.0" font-size="10" fill="#5C6470" text-anchor="middle">SSH tunnel</text>
  <text x="290.0" y="272.0" font-size="10" fill="#5C6470" text-anchor="middle">az network bastion tunnel</text>
  <path d="M290,285 V319" fill="none" stroke="#8A8A8A" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <rect x="120" y="322" width="340" height="70" rx="10" fill="#F1F1EE" stroke="#DAD7CE" stroke-width="1.5"/>
  <text x="290.0" y="347.0" font-size="13" fill="#16233A" text-anchor="middle" font-weight="bold">Jump box VM</text>
  <text x="290.0" y="367.0" font-size="10" fill="#5C6470" text-anchor="middle">no public IP</text>
  <text x="290.0" y="382.0" font-size="10" fill="#5C6470" text-anchor="middle">socat proxy to the PE NIC IP</text>
  <rect x="640" y="212" width="340" height="70" rx="10" fill="#F1F1EE" stroke="#DAD7CE" stroke-width="1.5"/>
  <text x="810.0" y="237.0" font-size="13" fill="#16233A" text-anchor="middle" font-weight="bold">P2S VPN Gateway</text>
  <text x="810.0" y="257.0" font-size="10" fill="#5C6470" text-anchor="middle">OpenVPN tunnel</text>
  <text x="810.0" y="272.0" font-size="10" fill="#5C6470" text-anchor="middle">Azure AD and MFA</text>
  <path d="M810,285 V319" fill="none" stroke="#8A8A8A" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <rect x="640" y="322" width="340" height="70" rx="10" fill="#F1F1EE" stroke="#DAD7CE" stroke-width="1.5"/>
  <text x="810.0" y="354.5" font-size="13" fill="#16233A" text-anchor="middle" font-weight="bold">Laptop joined to the VNet</text>
  <text x="810.0" y="374.5" font-size="10" fill="#5C6470" text-anchor="middle">VPN client connected</text>
  <path d="M290,395 V449" fill="none" stroke="#8A8A8A" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <path d="M810,395 V415 Q810,427 798,427 H392 Q380,427 380,439 V449" fill="none" stroke="#8A8A8A" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <rect x="200" y="452" width="240" height="70" rx="10" fill="#F1F1EE" stroke="#DAD7CE" stroke-width="1.5"/>
  <text x="320.0" y="477.0" font-size="13" fill="#16233A" text-anchor="middle" font-weight="bold">Private DNS zone</text>
  <text x="320.0" y="497.0" font-size="10" fill="#5C6470" text-anchor="middle">&lt;aura-instance-id&gt;.databases.neo4j.io</text>
  <text x="320.0" y="512.0" font-size="10" fill="#5C6470" text-anchor="middle">resolves to 10.x.x.x</text>
  <path d="M443,487 H497" fill="none" stroke="#8A8A8A" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <rect x="500" y="452" width="220" height="70" rx="10" fill="#F1F1EE" stroke="#DAD7CE" stroke-width="1.5"/>
  <text x="610.0" y="484.5" font-size="13" fill="#16233A" text-anchor="middle" font-weight="bold">Private Endpoint NIC</text>
  <text x="610.0" y="504.5" font-size="10" fill="#5C6470" text-anchor="middle">the private IP</text>
  <path d="M723,487 H777" fill="none" stroke="#2E6DB4" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="780" y="452" width="220" height="70" rx="10" fill="#EAF1FA" stroke="#2E6DB4" stroke-width="1.6"/>
  <text x="890.0" y="484.5" font-size="13" fill="#1F4F8A" text-anchor="middle" font-weight="bold">Neo4j Aura VDC</text>
  <text x="890.0" y="504.5" font-size="10" fill="#5E7FA8" text-anchor="middle">over the Azure backbone</text>
</svg>
